<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6636cf"><title>Trivia Duel · A little friendly rivalry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#262139;--muted:#726a81;--paper:#faf7f0;--purple:#6636cf;--line:#e5dfed;--green:#1a7251}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'DM Sans',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;transition:transform .15s,background .15s}button:hover:not(:disabled){transform:translateY(-2px)}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f6aa46;outline-offset:4px}header{max-width:1180px;margin:auto;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:700 23px 'Space Grotesk',system-ui;display:flex;align-items:center;gap:10px}.logo{background:var(--purple);color:white;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}.live{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.live:before{content:'';display:inline-block;width:7px;height:7px;background:#3a9864;border-radius:50%;margin-right:7px}main{max-width:1100px;margin:auto;padding:65px 28px 40px}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:70px;align-items:center}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--purple);text-transform:uppercase}.hero h1{font:700 clamp(42px,6vw,76px)/1.05 'Space Grotesk',system-ui;letter-spacing:-3px;margin:20px 0}.hero h1 span{color:var(--purple)}p{color:var(--muted);line-height:1.65}.intro{font-size:18px;max-width:420px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.chip{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:8px 12px;background:#fff}.spark{display:inline-block;background:#f1d583;color:#493717;font-size:13px;letter-spacing:0;border-radius:30px;padding:8px 13px;transform:rotate(-4deg);margin-top:12px}.card{background:white;border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 12px 0 #ede5f4}.tabs{display:flex;background:#f1edf7;padding:5px;border-radius:13px;margin-bottom:28px}.tabs button{flex:1;border:0;border-radius:9px;background:transparent;padding:12px;color:var(--muted);font-weight:700}.tabs button.active{background:white;color:var(--purple);box-shadow:0 2px 5px #21123412}h2{font:700 25px 'Space Grotesk',system-ui;margin:8px 0 12px}.subtitle{font-size:14px;margin-bottom:25px}label{display:block;font-size:13px;font-weight:700;margin:17px 0 8px}input{width:100%;border:1px solid #d9d2e3;border-radius:12px;padding:15px;color:var(--ink);background:#fdfcfe}input.code{text-transform:uppercase;letter-spacing:5px;font-weight:700}.primary{background:var(--purple);color:white;border:0;border-radius:12px;padding:16px 22px;font-weight:700;width:100%;margin-top:23px}.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 18px;color:var(--ink);font-weight:600}.small-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}.how{margin-top:75px;border-top:1px solid var(--line);padding-top:25px;display:grid;grid-template-columns:repeat(3,1fr);gap:35px}.how b{font-size:14px}.how p{font-size:13px}.num{font-weight:700;color:var(--purple);margin-right:8px}.game{max-width:760px;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.roomcode{background:#ede5fa;padding:10px 15px;border-radius:11px;font-weight:700;letter-spacing:3px;font-size:14px;color:var(--purple)}.center{text-align:center}.bigcode{font:700 clamp(35px,9vw,56px) 'Space Grotesk',system-ui;letter-spacing:8px;margin:20px 0;color:var(--purple)}.avatars{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0}.person{min-width:90px}.avatar{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;margin:0 auto 9px;font-size:22px;font-weight:700;background:#eee5fb;color:var(--purple)}.person:nth-child(2n) .avatar{background:#ffedd0;color:#875a20}.person:nth-child(3n) .avatar{background:#dff2e7;color:var(--green)}.person span{font-size:13px}.timer{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:700 23px 'Space Grotesk',system-ui;background:#ede5fa;color:var(--purple)}.timer.urgent{background:#ffe4df;color:#b43223}.progress{height:5px;background:#ece5f5;border-radius:10px;margin:20px 0 32px;overflow:hidden}.progress div{height:100%;background:var(--purple);transition:width .2s}.question{font:600 clamp(24px,4vw,36px)/1.25 'Space Grotesk',system-ui;margin:16px 0 28px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:white;border-radius:15px;padding:18px;color:var(--ink);min-height:80px;opacity:1!important}.answer .letter{display:grid;place-items:center;flex-shrink:0;width:32px;height:32px;border-radius:9px;background:#f2edf8;font-weight:700;color:var(--purple)}.answer.selected{border:2px solid var(--purple);background:#f1eafb}.answer.correct{border:2px solid var(--green);background:#e7f6ee}.answer.wrong{border:2px solid #bf5141;background:#fdefeb}.status{margin:20px 0;text-align:center;color:var(--muted);font-size:14px;min-height:23px}.board{margin-top:30px;background:white;border:1px solid var(--line);border-radius:20px;padding:23px}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f1edf5}.row:last-child{border:0}.rank{color:var(--muted);width:20px}.name{flex:1}.score{font-weight:700}.delta{font-size:12px;color:var(--green)}.badge{font-size:11px;border-radius:20px;background:#eee6fb;color:var(--purple);padding:4px 8px}.winner{font-size:70px;margin:10px 0}.banner{background:#f1e9fb;color:var(--purple);padding:12px;border-radius:12px;font-size:13px;margin-bottom:18px}.error{background:#fbe7e3;color:#9e3023;border-radius:12px;padding:12px;font-size:14px;margin-top:15px}.footer{text-align:center;font-size:12px;color:var(--muted);padding:30px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:var(--ink);color:white;z-index:5;font-size:14px;max-width:90vw}.connection{color:#ad5c16;text-align:center;font-size:13px;margin:10px} @media(max-width:700px){header{padding:20px}.live{font-size:10px}main{padding:35px 20px}.hero{grid-template-columns:1fr;gap:30px}.hero h1{font-size:51px;letter-spacing:-2px}.intro{font-size:16px}.chips{margin:18px 0}.card{padding:24px}.how{margin-top:45px;gap:15px}.how b{display:block}.num{display:block;margin-bottom:6px}.answers{grid-template-columns:1fr}.answer{min-height:65px;padding:14px}.question{font-size:26px}.topline{margin-bottom:20px}}
</style></head><body><header><div class="brand"><div class="logo">✦</div>Trivia Duel</div><div class="live">2–5 players · live rivalry</div></header><main id="app"></main><div class="footer">A little knowledge. A little speed. A lot of bragging rights.</div><div id="toast" hidden role="status"></div>
<script>window.PHONE_ADDRESS=__PHONE_ORIGIN__;</script><script>
const hostname=location.hostname;const isLocal=hostname==='localhost'||hostname==='127.0.0.1'||hostname.startsWith('192.168.')||hostname.startsWith('10.')||hostname==='[::1]'||(hostname.startsWith('172.')&&Number(hostname.split('.')[1])>=16&&Number(hostname.split('.')[1])<=31); const app=document.querySelector('#app');let mode='create',state=null,busy=false,clockOffset=0,lastView='',polling=false;let session;try{session=JSON.parse(sessionStorage.getItem('duel'))}catch{};
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4000)}
async function api(action,body={}){const res=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,...body})});const data=await res.json();if(!res.ok)throw Error(data.error||'Unable to connect.');return data;}
function home(){app.innerHTML=`<div class="hero"><section><div class="eyebrow">Your next game night starts here</div><h1>Friends.<br>Phones.<br><span>Friendly fire.</span></h1><p class="intro">Big questions. Quick decisions. Challenge your favorite people to a battle of brains.</p><div class="chips"><span class="chip">✦ 2–5 players</span><span class="chip">◷ About 5 minutes</span><span class="chip">↗ Play on your phone</span></div><span class="spark">Bragging rights included.</span></section><section class="card"><div class="tabs"><button class="${mode==='create'?'active':''}" onclick="switchMode('create')">Create a room</button><button class="${mode==='join'?'active':''}" onclick="switchMode('join')">Join a room</button></div><h2>${mode==='create'?'Let the rivalry begin.':'You’re invited.'}</h2><p class="subtitle">${mode==='create'?'Make a room, share the code, and gather your rivals.':'Enter the code your host shared with you.'}</p><form id="entry"><label for="nickname">Your nickname</label><input id="nickname" maxlength="20" placeholder="What should we call you?" autocomplete="nickname" required>${mode==='join'?'<label for="code">Room code</label><input id="code" class="code" maxlength="6" minlength="6" placeholder="ABC123" autocapitalize="characters" autocomplete="off" required>':''}<button class="primary" id="submit">${mode==='create'?'Create room →':'Join the game →'}</button><div id="error" role="alert"></div></form><div class="small-note">No accounts. Just a nickname and a room code.</div></section></div><div class="how"><div><b><span class="num">01</span> Gather your people</b><p>Open this address on each phone and join with the room code.</p></div><div><b><span class="num">02</span> Trust your brain</b><p>10 questions. 20 seconds each. One locked answer.</p></div><div><b><span class="num">03</span> Take the crown</b><p>100 points for being right. Up to 50 more for being quick.</p></div></div>`;document.querySelector('#entry').onsubmit=enter;}
function switchMode(m){const nickname=document.querySelector('#nickname')?.value;mode=m;home();document.querySelector('#nickname').value=nickname||'';}
async function enter(e){e.preventDefault();if(busy)return;busy=true;document.querySelector('#submit').disabled=true;try{session=await api(mode,{name:document.querySelector('#nickname').value,code:document.querySelector('#code')?.value});sessionStorage.setItem('duel',JSON.stringify(session));state=null;lastView='';await poll();}catch(e){document.querySelector('#error').innerHTML=`<div class="error">${escape(e.message)}</div>`;}finally{busy=false;const b=document.querySelector('#submit');if(b)b.disabled=false;}}
function board(s){return `<div class="board"><div class="eyebrow">${s.phase==='finished'?'Final standings':'Leaderboard'}</div>${[...s.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="name">${escape(p.name)} ${p.id==='me'?'<span class="badge">you</span>':''} ${p.winner?'♛':''}</span>${s.phase==='reveal'?`<span class="delta">+${p.points}</span>`:`<span class="badge">${p.answered?'locked':'playing'}</span>`}<span class="score">${p.score.toLocaleString()}</span></div>`).join('')}</div>`;}
function render(s){const key=JSON.stringify(s,(k,v)=>['now'].includes(k)?undefined:v);if(key===lastView)return;lastView=key;const topline=`<div class="topline"><span class="eyebrow">${s.phase==='lobby'?'The waiting room':s.phase==='finished'?'The results':s.sudden?'Sudden death':`Question ${s.round+1} of 10`}</span><button class="secondary roomcode" onclick="copyCode()" title="Copy room code">${s.code} ⧉</button></div>`;
 if(s.phase==='lobby'){app.innerHTML=`<div class="game">${topline}${isLocal?'<div class="banner">Local preview: joining from another location requires the online hosted version.</div>':''}<section class="card center"><div class="eyebrow">Invite your competition</div><h2>One code. Everyone’s in.</h2><div class="bigcode">${s.code}</div><p>Share this site address and code.<br>Players join from anywhere using the invite link and room code.</p><button class="secondary" onclick="shareRoom()">Copy invite link</button><div class="avatars">${s.players.map(p=>`<div class="person"><div class="avatar">${escape(p.name[0].toUpperCase())}</div><span>${escape(p.name)}${p.id==='me'?' · you':''}</span></div>`).join('')}</div><div class="small-note">${s.players.length}/5 players joined · minimum 2</div>${s.host?`<button class="primary" onclick="act('start')" ${s.players.length<2?'disabled':''}>Start the duel →</button>`:'<p>Waiting for the host to start…</p>'}<button class="secondary" style="margin-top:15px" onclick="leave()">Leave room</button></section></div>`;return;}
 if(s.phase==='finished'){const names=s.players.filter(p=>p.winner).map(p=>escape(p.name)).join(', ');app.innerHTML=`<div class="game">${topline}<section class="card center"><div class="winner">♛</div><div class="eyebrow">Bragging rights secured</div><h2>${names} takes the crown!</h2><p>A worthy duel. Ready for round two?</p>${s.host?'<button class="primary" onclick="act(\'rematch\')">Rematch with fresh questions ↻</button>':'<p>Waiting for the host to choose a rematch.</p>'}<button class="secondary" style="margin-top:15px" onclick="leave()">Leave room</button></section>${board(s)}</div>`;return;}
 const q=s.question,reveal=s.phase==='reveal',locked=s.selection!==undefined;app.innerHTML=`<div class="game">${topline}${s.sudden?`<div class="banner">Tiebreaker: ${s.tied?'you’re competing for the crown.':'you can still answer; only tied leaders compete for the crown.'}</div>`:''}<div class="topline"><span class="chip">${escape(q.category)}</span><div class="timer" id="timer"></div></div><div class="progress"><div id="progress"></div></div><h2 class="question">${escape(q.text)}</h2><div class="answers">${q.choices.map((a,i)=>`<button class="answer ${locked&&s.selection===i?'selected':''} ${reveal&&q.answer===i?'correct':''} ${reveal&&s.selection===i&&q.answer!==i?'wrong':''}" onclick="answer(${i})" ${locked||reveal?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escape(a)}</span></button>`).join('')}</div><div class="status" id="status">${reveal?`Correct answer: ${escape(q.choices[q.answer])} · next round shortly` :locked?'Answer locked. Fingers crossed!':`${s.players.filter(p=>p.answered).length}/${s.players.length} answers locked`}</div>${board(s)}</div>`;tick();}
async function act(action,body={}){if(busy)return;busy=true;try{state=await api(action,body);clockOffset=state.now-Date.now();render(state)}catch(e){toast(e.message)}finally{busy=false}}
function answer(choice){if(state&&Date.now()+clockOffset>=state.started)act('answer',{choice,round:state.round});}
function tick(){if(!state||!['question','reveal'].includes(state.phase))return;const now=Date.now()+clockOffset;const countdown=now<state.started;const seconds=Math.max(0,Math.ceil(((countdown?state.started:state.phase==='reveal'?state.next:state.deadline)-now)/1000));const el=document.querySelector('#timer');if(el){el.textContent=seconds;el.classList.toggle('urgent',!countdown&&seconds<=5&&state.phase==='question');}const bar=document.querySelector('#progress');if(bar)bar.style.width=Math.max(0,Math.min(100,(state.deadline-now)/20000*100))+'%';document.querySelectorAll('.answer').forEach(b=>b.disabled=state.phase==='reveal'||state.selection!==undefined||countdown||now>=state.deadline);if(countdown){document.querySelector('#status').textContent='Get ready… question opens in '+seconds;}else if(state.phase==='question'&&state.selection===undefined){document.querySelector('#status').textContent=state.players.filter(p=>p.answered).length+'/'+state.players.length+' answers locked';}}
async function poll(){if(!session||polling)return;polling=true;try{const s=await api('state');state=s;clockOffset=s.now-Date.now();render(s);document.querySelector('.connection')?.remove();}catch(e){if(/Room not found|session is no longer/.test(e.message)){session=null;sessionStorage.removeItem('duel');state=null;home();toast(e.message)}else if(!document.querySelector('.connection'))app.insertAdjacentHTML('afterbegin','<div class="connection" role="status">Connection lost. Reconnecting…</div>');}finally{polling=false}}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied!')}catch{toast(text)}}function copyCode(){copy(state.code)}function shareRoom(){copy((isLocal?(window.PHONE_ADDRESS||location.origin):location.origin)+'/?room='+state.code)}
async function leave(){try{await api('leave');session=null;state=null;sessionStorage.removeItem('duel');home()}catch(e){toast(e.message)}}
home();const room=new URLSearchParams(location.search).get('room');if(room&&!session){switchMode('join');document.querySelector('#code').value=room;}if(session)poll();setInterval(poll,600);setInterval(tick,100);
</script></body></html>
